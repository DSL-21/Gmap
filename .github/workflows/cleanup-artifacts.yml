name: Clean superseded APK artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Cleanup Gmap artifacts')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete archived debug APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "gmap-debug-apk") | .id' |
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            echo "Deleting superseded APK artifact $artifact_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
