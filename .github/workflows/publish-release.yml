name: Publish Gmap 2.1.0 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-gmap-2-1-0
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build, test and publish Gmap 2.1.0
    if: startsWith(github.event.head_commit.message, 'Release Gmap v2.1.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Add API 37 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/gmap-2.1.0.apk
          cd release-assets
          sha256sum gmap-2.1.0.apk > gmap-2.1.0.apk.sha256

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.1.0 \
            release-assets/gmap-2.1.0.apk \
            release-assets/gmap-2.1.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gmap 2.1.0" \
            --notes "## Gmap 2.1.0

          Gmap 2.1 expands the app from a single-host TCP scanner into a multi-module rootless network toolkit.

          ### Modules
          - Network dashboard with active interface, IP addresses, gateway and DNS.
          - Local IPv4 device discovery using bounded TCP probes and one-tap handoff to host scanning.
          - Non-blocking TCP Connect scans for single hosts, custom ranges 1–65535, adaptive socket scheduling and service identification.
          - UDP probe scans for ranges up to 512 ports, with DNS, NTP, SSDP and mDNS probes.
          - UDP states distinguish OPEN, CLOSED, OPEN|FILTERED and ERROR.
          - Web audit for DNS, HTTP/HTTPS status, TLS peer certificate details, security headers and cookie attributes.
          - Combined in-memory Findings history for TCP, UDP and Web results.
          - User-initiated copy of Web audit reports.

          ### Download
          Download **gmap-2.1.0.apk** for Android 8.0 (API 26) or later.

          ### Build
          This is a CI debug-signed APK for direct installation and testing. It is not signed with a dedicated production keystore or packaged for Google Play. A SHA-256 checksum is included.

          ### Technical scope
          Local device discovery uses TCP presence probes rather than ARP. UDP silence remains OPEN|FILTERED, not confirmed CLOSED. The Web module checks response configuration and headers; it does not perform exploit testing or CVE database correlation. Gmap does not claim raw TCP SYN, raw ICMP crafting, Wi-Fi monitor mode or packet injection. The app targets Android SDK 36."
