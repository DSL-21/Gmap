name: Publish Gmap 2.11.0 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-gmap-2-11-0
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build, test and publish Gmap 2.11.0
    if: startsWith(github.event.head_commit.message, 'Release Gmap v2.11.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android 17 SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Add API 37 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Android Lint, unit tests and assemble APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/gmap-2.11.0.apk
          (cd release-assets && sha256sum gmap-2.11.0.apk > gmap-2.11.0.apk.sha256)
          cat > release-assets/release-notes.md <<'EOF'
          ## Gmap 2.11.0 — hardened Web Audit

          ### DNS, TLS and request safety
          - Replaced the Web audit transport with OkHttp 5.5.1 and pinned each audit's resolved DNS answer set to the actual connections.
          - Retained the original hostname for HTTP Host routing, TLS SNI and platform certificate hostname verification.
          - Disabled automatic redirects, cookies, system proxy use and implicit connection retries.
          - Preserved raw URL path escapes and removed query strings and fragments before every initial or redirect request.
          - Enforced the same-host/port redirect boundary, rejected HTTPS downgrades and added cancellation of active HTTP calls.
          - Added per-call timeouts, an overall scan deadline, an 18-request total budget and a strict 256-byte body sample limit.

          ### Better Web findings and user interface
          - Parsed CSP directives and limited browser-document header checks to HTML/XHTML responses to reduce false positives on APIs.
          - Added stable finding IDs, categories, confidence estimates, endpoint context, TLS version and request count.
          - Downgraded synthetic credentialed CORS reflection to medium severity; the observation is evidence, not proof of sensitive data exposure.
          - Added fixed public metadata checks for security.txt, robots.txt, OpenAPI, Swagger UI, sitemap.xml and exposed Git HEAD.
          - Added a Stop control and asynchronous DNS-aware local-network permission preflight.

          ### Validation and limitations
          Android Lint, unit tests and debug APK assembly must pass in GitHub Actions before release. Physical-device testing is still required for Android 17 local-network permission behavior, OEM TLS providers, mobile networks and real-world servers.

          Gmap performs user-initiated, unauthenticated, read-only checks. It does not execute JavaScript, submit forms, brute-force paths or exploit vulnerabilities. Use it only on systems you own or are authorized to assess. TCP Connect is not SYN scanning; non-root Android restrictions still apply. This APK is CI debug-signed, not a production or Play Store package.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.11.0
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/gmap-2.11.0.apk \
            release-assets/gmap-2.11.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gmap 2.11.0 — hardened Web Audit" \
            --notes-file release-assets/release-notes.md
