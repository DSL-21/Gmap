name: Publish Gmap 2.3.1 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-gmap-2-3-1
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build, test and publish Gmap 2.3.1
    if: startsWith(github.event.head_commit.message, 'Release Gmap v2.3.1')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Add API 37 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/gmap-2.3.1.apk
          cd release-assets
          sha256sum gmap-2.3.1.apk > gmap-2.3.1.apk.sha256

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.3.1 \
            release-assets/gmap-2.3.1.apk \
            release-assets/gmap-2.3.1.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gmap 2.3.1" \
            --notes "## Gmap 2.3.1

          ### What's new
          - Cleaner Network dashboard with a compact connection summary and one-tap local discovery.
          - Four primary destinations: Network, Scan, Web and Results.
          - Version-aware software fingerprints and CPE 2.3 candidate generation.
          - Optional CVE enrichment from NVD, CISA KEV and FIRST EPSS.
          - Results include CVSS, EPSS, KEV status and remediation guidance where available.
          - Web report clipboard export removed to preserve strict RAM-only result handling.
          - TCP/UDP scanning, Web audit and in-memory history are retained.

          ### Download
          Download **gmap-2.3.1.apk** for Android 8.0 (API 26) or later.

          ### Build and scope
          This is a CI debug-signed APK for direct installation and testing, not a production-keystore or Google Play package. A SHA-256 checksum is included. Local discovery uses TCP presence probes rather than ARP. UDP silence is reported as OPEN|FILTERED. Web audit checks HTTP/TLS configuration and security headers; it is not an exploit scanner or CVE audit. Gmap does not claim raw TCP SYN, raw ICMP crafting, Wi-Fi monitor mode or packet injection. The app targets Android SDK 36."
