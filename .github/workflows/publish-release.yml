name: Publish Gmap 2.7.0 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-gmap-2-6-0
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build, test and publish Gmap 2.7.0
    if: startsWith(github.event.head_commit.message, 'Release Gmap v2.7.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android 17 SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Add API 37 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Android Lint, unit tests and assemble APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/gmap-2.7.0.apk
          (cd release-assets && sha256sum gmap-2.7.0.apk > gmap-2.7.0.apk.sha256)
          cat > release-assets/release-notes.md <<'EOF'
          ## Gmap 2.7.0 — adaptive TCP scanner reliability

          ### Scanner improvements
          - Resolve hostnames to all returned IPv4 and IPv6 addresses and scan each address independently.
          - Preserve the target IP on every result, so identical ports on different addresses remain distinguishable.
          - Aggregate scan progress and result counts across resolved addresses.
          - Start selector-managed TCP probing at the existing 32-probe safety ceiling, with adaptive backoff under local socket pressure.
          - Classify timeout-like connection failures as FILTERED rather than CLOSED; refused connections remain CLOSED and unknown failures remain ERROR.
          - Add regression coverage ensuring every requested port is represented exactly once.

          ### UI and documentation
          - Remove redundant scan-screen disclaimer and instructional copy.
          - Update scanner architecture documentation and changelog.

          ### Validation and limitations
          Android Lint, unit tests and debug APK assembly passed in GitHub Actions before merge. Physical-device testing is still required, especially for DNS/CDN targets and IPv6 reachability. The previously reported missing port 443 on ibuumerang.com has not yet been independently confirmed as fixed on the original phone and network.

          Gmap performs user-initiated, read-only network checks. Use it only on systems you own or are authorized to assess. TCP Connect scanning is not SYN scanning; non-root Android restrictions still apply. This APK is CI debug-signed, not a production or Play Store package.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.7.0
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/gmap-2.7.0.apk \
            release-assets/gmap-2.7.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gmap 2.7.0 — adaptive TCP scanner reliability" \
            --notes-file release-assets/release-notes.md
