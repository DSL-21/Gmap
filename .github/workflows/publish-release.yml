name: Publish Gmap 2.10.0 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-gmap-2-10-0
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build, test and publish Gmap 2.10.0
    if: startsWith(github.event.head_commit.message, 'Release Gmap v2.10.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android 17 SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Add API 37 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Android Lint, unit tests and assemble APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/gmap-2.10.0.apk
          (cd release-assets && sha256sum gmap-2.10.0.apk > gmap-2.10.0.apk.sha256)
          cat > release-assets/release-notes.md <<'EOF'
          ## Gmap 2.10.0 — professional rootless UDP engine

          ### UDP engine and protocol coverage
          - Rebuilt UDP scanning with non-blocking DatagramChannel and Selector; no coroutine is created per port.
          - Added bounded adaptive concurrency (up to 64 probes), fair retry scheduling, configurable timeouts and 0–3 retries.
          - Added prompt cancellation checks and deterministic cleanup of in-flight datagram channels.
          - Increased the per-address range ceiling to 4,096 and capped aggregate DNS host/port checks at 16,384.
          - Added DNS transaction validation and NTP server-response validation.
          - Added NOT_TESTED classification for protocols requiring credentials, file requests, broadcast or multicast semantics.
          - Added separate local IPv4 multicast discovery for SSDP M-SEARCH and mDNS DNS-SD.
          - Added full result-state visibility, attempt counts, service-confirmation evidence and bounded response previews.
          - Aligned UDP DNS target selection with TCP: one deterministic IP by default and an optional scan-all-addresses switch.

          ### Privacy, safety and documentation
          - Kept scan settings, histories and response previews in RAM.
          - No SNMP default community or guessed TFTP filename is sent.
          - Updated README, architecture notes and changelog.

          ### Validation and limitations
          Android Lint, unit tests and debug APK assembly must pass in GitHub Actions before release. Physical-device testing is still required across Wi-Fi, mobile data, filtered networks, DNS/CDN targets and IPv6 reachability. Retries and adaptive concurrency improve coverage but cannot force a remote host or firewall to answer.

          Gmap performs user-initiated, read-only network checks. Use it only on systems you own or are authorized to assess. TCP Connect scanning is not SYN scanning; non-root Android restrictions still apply. This APK is CI debug-signed, not a production or Play Store package.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.10.0
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/gmap-2.10.0.apk \
            release-assets/gmap-2.10.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gmap 2.10.0 — professional rootless UDP engine" \
            --notes-file release-assets/release-notes.md
