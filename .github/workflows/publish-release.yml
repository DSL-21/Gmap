name: Publish Gmap 2.0.1 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-gmap-2-0-1
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build, test and publish Gmap 2.0.1
    if: startsWith(github.event.head_commit.message, 'Release Gmap v2.0.1')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Add API 37 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/gmap-2.0.1.apk
          cd release-assets
          sha256sum gmap-2.0.1.apk > gmap-2.0.1.apk.sha256

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.1 \
            release-assets/gmap-2.0.1.apk \
            release-assets/gmap-2.0.1.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gmap 2.0.1" \
            --notes "## Gmap 2.0.1

          Gmap 2.0.1 removes the mandatory pre-scan confirmation and all in-app responsible-use notices.

          ### Highlights
          - Non-blocking TCP Connect port scanning for a single hostname, IPv4 or IPv6 target.
          - Custom TCP port ranges from 1 to 65535, with Quick, Well-known, Extended and Full TCP presets.
          - Adaptive socket scheduling with local resource-pressure backoff and retry.
          - Explicit OPEN, CLOSED, FILTERED and ERROR states, live progress, throughput and cancellation.
          - Read-only service identification for selected SSH, FTP, SMTP, POP3, IMAP, VNC, MySQL, HTTP, TLS, Redis and PostgreSQL services.
          - HTTP response metadata and TLS session/certificate details where supported.
          - In-memory scan history only; no scan-result database, automatic report files, analytics or cloud sync.
          - English Jetpack Compose interface.

          ### Download and installation
          Download **gmap-2.0.1.apk** and install it on an Android device running Android 8.0 (API 26) or later.

          ### Build status and signing
          This is a CI-generated debug-signed APK for direct installation and testing. It is not signed with a dedicated production keystore or packaged for Google Play. A SHA-256 checksum is included.

          ### Current scope and limitations
          Gmap 2.0.1 currently provides single-host TCP Connect scanning and best-effort identification for selected protocols. It does not implement raw TCP SYN, raw ICMP packet crafting, ARP packet scanning, Wi-Fi monitor mode or packet injection. Subnet discovery, UDP scanning, broader security assessment and device-level performance benchmarking remain future work. The app targets Android SDK 36."
