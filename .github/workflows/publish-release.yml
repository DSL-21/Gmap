name: Publish Gmap 2.9.0 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-gmap-2-9-0
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build, test and publish Gmap 2.9.0
    if: startsWith(github.event.head_commit.message, 'Release Gmap v2.9.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android 17 SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Add API 37 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Android Lint, unit tests and assemble APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/gmap-2.9.0.apk
          (cd release-assets && sha256sum gmap-2.9.0.apk > gmap-2.9.0.apk.sha256)
          cat > release-assets/release-notes.md <<'EOF'
          ## Gmap 2.9.0 — predictable DNS scanning and exact port ranges

          ### TCP target selection and port range handling
          - Hostnames resolve to all available DNS answers, but Gmap scans one deterministic IPv4-preferred address by default.
          - Added an explicit option to scan every returned DNS address.
          - The TCP engine receives the exact requested start/end port range for each selected address.
          - Progress counts host/port checks and the aggregate scan is capped at 262,144 checks.
          - Added regression tests for deterministic single-address selection and opt-in multi-address scanning.

          ### Privacy and settings
          - Removed persistent TCP scan settings; scan tuning remains in memory and resets after process restart.
          - Removed legacy TCP scan preferences from previous app versions.
          - Retained bounded retries, adaptive concurrency, per-address result attribution and service fingerprinting.

          ### Documentation
          - Updated README, architecture notes and changelog.

          ### Validation and limitations
          Android Lint, unit tests and debug APK assembly must pass in GitHub Actions before release. Physical-device testing is still required across Wi-Fi, mobile data, filtered networks, DNS/CDN targets and IPv6 reachability. Retries and adaptive concurrency improve coverage but cannot force a remote host or firewall to answer.

          Gmap performs user-initiated, read-only network checks. Use it only on systems you own or are authorized to assess. TCP Connect scanning is not SYN scanning; non-root Android restrictions still apply. This APK is CI debug-signed, not a production or Play Store package.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.9.0
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/gmap-2.9.0.apk \
            release-assets/gmap-2.9.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gmap 2.9.0 — predictable DNS scan scope" \
            --notes-file release-assets/release-notes.md
